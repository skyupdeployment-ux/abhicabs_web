[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"
  VITE_API_BASE_URL = "https://api.abhicabs24x7.com/api/v1"

# SPA fallback — all routes that don't match a static file
# are served by index.html so Vike's client-side router handles them.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Cache static assets aggressively (Vite hashed filenames)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
